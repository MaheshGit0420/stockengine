spring.application.name=stockengine

spring.datasource.url=jdbc:h2:mem:stockengine-db
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true


spring.kafka.admin.auto-create-topics=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
#
##spring.kafka.consumer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
##spring.kafka.consumer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
#
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.mahesh.stockengine.messaging.events